[project]
name = "audiblez"
version = "0.4.9"
description = "Generate audiobooks from e-books and PDFs (epub/pdf to wav/m4b)"
authors = [
    { name = "Claudio Santini", email = "hireclaudio@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ebooklib (>=0.20,<0.21)",
    "soundfile (>=0.14.0,<0.15.0)",
    "pick (>=2.6.0,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "spacy (>=3.8.16,<4.0.0)",
    "kokoro (>=0.9.4,<0.10.0)",
    "misaki[zh] (>=0.9.4)",
    "tabulate (>=0.10.0,<0.11.0)",
    "pdfminer.six (>=20260107)",
    "requests (>=2.34.2,<3.0.0)",
    "numpy (>=2.0.0)",
    "torch (>=2.6.0)",
]
exclude = [
    "imgs",
    "test",
    "*.wav",
    "*.m4b",
    "cover",
    "chapters.txt"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://claudio.uk/posts/epub-to-audiobook.html"
Documentation = "https://github.com/santinic/audiblez"
Repository = "https://github.com/santinic/audiblez"
Issues = "https://github.com/santinic/audiblez/issues"

[project.optional-dependencies]
gui = [
    "wxpython (>=4.3.2,<5.0.0)",
    "pillow (>=11.0.0)",
]
verify = [
    "faster-whisper (>=1.2.1,<2.0.0)",
]
profile = [
    "speechbrain (>=1.1.2,<2.0.0)",
    "torchaudio (>=2.6.0)",
    "transformers (>=4.48.0)",
]

[project.scripts]
audiblez = "audiblez.cli:cli_main"
audiblez-ui = "audiblez.ui:main"

[tool.poetry.group.dev.dependencies]
deptry = "^0.25.1"